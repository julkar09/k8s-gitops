# IRSA ServiceAccount for the backend.
# The role-arn annotation is what binds this Kubernetes ServiceAccount to an
# AWS IAM role via the cluster's OIDC provider. Pods that run as this SA get
# temporary AWS credentials for that role — no static keys.
#
# Replace <AWS_ACCOUNT_ID> with your account id. The IAM role + trust policy
# are created out-of-band (see README → "AWS access via IRSA").
apiVersion: v1
kind: ServiceAccount
metadata:
  name: flask-basic-app
  namespace: backend
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::<AWS_ACCOUNT_ID>:role/flask-basic-app-irsa
