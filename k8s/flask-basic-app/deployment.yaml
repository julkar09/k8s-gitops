apiVersion: apps/v1
kind: Deployment
metadata:
  name: flask-basic-app
  namespace: backend
  labels:
    app: flask-basic-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: flask-basic-app
  template:
    metadata:
      labels:
        app: flask-basic-app
    spec:
      serviceAccountName: flask-basic-app # IRSA — grants pods the flask-basic-app-irsa IAM role
      containers:
        - name: flask-basic-app
          image: arifhossen/flask-basic-app:latest
          ports:
            - containerPort: 5007
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
          readinessProbe:
            httpGet:
              path: /
              port: 5007
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 5007
            initialDelaySeconds: 15
            periodSeconds: 20
